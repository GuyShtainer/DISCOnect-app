[package]
name = "disconect-app"
version = "0.1.0"
description = "DISCOnect app shell over the Rust core (in-process, or the sidecar on a macOS release)"
authors = ["Guy Shtainer"]
license = "AGPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "disconect_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
# The core in-process (Bet 12a): `inproc.rs` runs a `serve::Session` on a thread. The core is built
# with THIS crate's profiles, so the release stanza below governs it too (same optimisation, plus LTO).
disconect-core = { path = "../../core" }
# Bet 15 slice 4: the coach's one egress point (`src/coach/egress.rs`). `rustls` brings the `ring` crypto
# provider; `platform-verifier` makes the OS trust store the root of trust for a user-chosen cloud endpoint.
# Nothing else in this crate may name `ureq` (tests/egress_guards.rs). The core links the same ureq for the LAN relay.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# Already in the tree through tauri and ureq; the coach's endpoint rules parse with it.
url = "2"

# The iOS start-up hook (`src/ios.rs`): the backup flag and the file protection class. Already in the iOS graph
# through tauri/wry (same locked version, so no new package); only the classes the hook names are enabled here.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSURL", "NSArray", "NSDictionary", "NSValue", "NSError", "NSFileManager", "NSNotification", "NSOperation", "block2"] }
objc2 = "0.6.4"
# The app-switcher cover (`src/cover.rs`, 12-F row 5b): UIKit's window, view, label and colour classes and the two
# lifecycle notifications. All three are already in the iOS graph through tauri/wry at these locked versions (no new
# package; MIT, Zlib OR Apache-2.0 OR MIT, MIT).
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIApplication", "UIWindow", "UIView", "UILabel", "UIColor", "UIResponder", "UIScene", "UIWindowScene", "NSText", "UIFont", "UIScreen"] }
block2 = "0.6.2"

# 12-F row 4: the pairing screen's camera. A phone-only plugin (Android and iOS; the Mac app never links it), pinned to
# one release with the lockfile. Apache-2.0 OR MIT. It is registered `#[cfg(mobile)]` in `lib.rs`, and the page reaches
# it only through the iOS-scoped capability `capabilities/phone-scan.json`.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = "=2.5.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# `unwind`, not `abort`: with the core in-process, a panic in fitparser on a malformed file must not
# take the app down. Two `catch_unwind` sites turn it into a per-file failure: `fit.rs` (around
# `processor.deserialize_next`) and `serve.rs::import_worker` (around the whole import). Under
# `panic = "abort"` both are dead code and the process dies. `tests/inproc.rs` reads this file and
# fails if the value changes.
panic = "unwind"
strip = true

# Argon2id at the production cost (256 MiB, t = 3) is unusably slow unoptimised; dependency profiles
# of `disconect-core`'s own manifest do not apply when it is a dependency, so they are repeated here.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[dev-dependencies]
# The mock runtime for AppHandle-level command tests (coach_ask through the real managed state).
tauri = { version = "2", features = ["test"] }
# Reads `tauri.conf.json` + the platform file exactly as `tauri-build` does (tests/mobile_config.rs);
# already in the tree through `tauri-build`, so no new crate is compiled.
tauri-utils = { version = "2", features = ["config-json5"] }
# Already in the tree through the core; the key-account test recomputes the id the code hard-codes.
sha2 = "0.11"
