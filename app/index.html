<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DISCOnect — hello world</title>
    <link rel="stylesheet" href="/src/tokens.css" />
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; padding: var(--space-4); background: var(--surface); color: var(--ink); font-family: var(--font-sans); }
      h1 { margin: 0 0 var(--space-1); }
      .card { background: var(--surface-raised); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: var(--space-4); }
      #chart { width: 100%; height: 400px; }
      #note { color: var(--ink-muted); margin: var(--space-2) 0 0; }
      footer { color: var(--ink-muted); margin-top: var(--space-6); }
    </style>
  </head>
  <body>
    <h1 class="display">Daily steps</h1>
    <p id="legend" class="caption"></p>
    <div class="card"><div id="chart"></div></div>
    <p id="note" class="caption">loading…</p>
    <footer class="caption">Not affiliated with or endorsed by any watch manufacturer.</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
