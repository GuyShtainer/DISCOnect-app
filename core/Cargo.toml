[package]
name = "disconect-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "DISCOnect Rust core: opens the same SQLCipher store with the same key file as the Python core"
publish = false

[lib]
name = "disconect_core"
path = "src/lib.rs"

[[bin]]
name = "disconect-core"
path = "src/bin/disconect-core.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.6"
chacha20poly1305 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: shortest-repr f64s must parse exactly, in the release binary too.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
fs2 = "0.4"
hex = "0.4"
chrono = "0.4"
fitparser = "=0.11.0"
flate2 = "1.1.10"
fancy-regex = "0.19.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
ryu = "1.0.23"

[dev-dependencies]
tempfile = "3"

# Argon2id at the production cost (256 MiB, t = 3) is unusably slow unoptimised.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
